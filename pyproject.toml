[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-quant"
version = "2.0.0"
description = "Professional quantitative trading platform - event-driven backtester with multi-asset support"
authors = [{name = "Aurora Quant", email = "team@auroraquant.com"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "websocket-client>=1.6.0",
    "ta>=0.10.2",
    "yfinance>=0.2.32",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "black>=23.0.0", "ruff>=0.1.0"]
ml = ["tensorflow>=2.13.0", "torch>=2.0.0"]
